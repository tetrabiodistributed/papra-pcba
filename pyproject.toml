[project]
name = "papra-pcba-checks"
version = "0.1.0"
description = "Reproducible validation of the Eagle -> KiCad migration of the PAPRa PCBA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest>=8",
    "pygerber>=2.4",
    "numpy>=2",
    "pillow>=10",
    "segno>=1.6.6",
]

[tool.pytest.ini_options]
testpaths = ["checks"]
addopts = "-ra"
# Every warning is an error. The one exception is upstream: pygerber 2.4.3 (its latest
# release) builds its grammar with pyparsing's `oneOf`, which pyparsing 3.3 (Dec 2025)
# deprecated. Drop the filter when pygerber releases a fix or is replaced.
filterwarnings = [
    "error",
    "ignore:'oneOf' deprecated - use 'one_of':pyparsing.exceptions.PyparsingDeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checks"]
